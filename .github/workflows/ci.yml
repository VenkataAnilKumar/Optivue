name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint, Type-Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app/ --ignore-missing-imports
      - name: Unit tests
        env:
          DEMO_MODE: "true"
        run: pytest tests/unit/ -v --tb=short --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — Lint, Type-Check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --passWithNoTests

  infra:
    name: Infrastructure — Type-Check, CDK Synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/infra/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: CDK Synth
        env:
          CDK_ACCOUNT: "000000000000"
          CDK_REGION: "us-east-1"
        run: npx cdk synth --quiet
